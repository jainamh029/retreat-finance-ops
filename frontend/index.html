<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retreat Finance Ops</title>
  <link rel="stylesheet" href="style.css" />
  <!-- one charting dep, pinned, from the CSP-allowed CDN; app.js degrades to a table if it fails -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
  <script>
    // API base resolution order:  ?api=<url>  >  localStorage (gear override)  >  this default.
    // Default auto-picks: the deployed Render backend when served from GitHub Pages, else local dev.
    (function () {
      var qs = new URLSearchParams(location.search).get("api");
      var saved = null;
      try { saved = localStorage.getItem("retreat.apiBase"); } catch (e) {}
      var isPages = /\.github\.io$/.test(location.hostname);
      window.RETREAT_API_BASE = qs || saved || window.RETREAT_API_BASE ||
        (isPages ? "https://retreat-finance-ops-api.onrender.com" : "http://localhost:8000");
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▮▮</span>
      <span class="brand-name">RETREAT&nbsp;FINANCE&nbsp;OPS</span>
    </div>
    <div class="topbar-right">
      <span class="as-of" id="asOf" title="the date the dataset is built around">data as of&nbsp;—</span>
      <button id="gearBtn" class="gear-btn" aria-haspopup="dialog" aria-expanded="false"
              title="Reconciliation matching tolerance">⚙ tolerance</button>
    </div>
  </header>

  <div class="shell">
    <nav class="nav" aria-label="Primary">
      <a href="#/dashboard" data-nav="dashboard"><span class="nav-i" aria-hidden="true">▤</span> Dashboard</a>
      <a href="#/ar"        data-nav="ar"><span class="nav-i" aria-hidden="true">▸</span> AR</a>
      <a href="#/ap"        data-nav="ap"><span class="nav-i" aria-hidden="true">◂</span> AP</a>
      <a href="#/reconcile" data-nav="reconcile"><span class="nav-i" aria-hidden="true">⇄</span> Reconcile</a>
      <a href="#/budget"    data-nav="budget"><span class="nav-i" aria-hidden="true">▦</span> Budget</a>
      <a href="#/benchmarks" data-nav="benchmarks"><span class="nav-i" aria-hidden="true">◒</span> Benchmarks</a>
    </nav>

    <main id="view" class="view" tabindex="-1">
      <div class="loading">loading…</div>
    </main>
  </div>

  <footer class="provenance" id="provenanceFooter">
    <div class="prov-line">
      <span class="prov-label">Data:</span>
      <span id="provSources">UCI Online Retail II · Berka PKDD'99 · SEC EDGAR · web-cited 2026 pricing</span>
      <button id="provToggle" class="linkish" aria-expanded="false"
              aria-controls="provPanel">what's real vs constructed ▸</button>
    </div>
    <div id="provPanel" class="prov-panel" hidden></div>
  </footer>

  <!-- gear popover -->
  <div id="gearPopover" class="popover" role="dialog" aria-label="Matching tolerance" hidden>
    <h3>Matching tolerance</h3>
    <p class="popover-sub">Re-runs <code>/api/reconciliation/report</code> live. Watch recall/precision move.</p>
    <label>Amount tolerance
      <span class="row2">
        <input type="number" id="tolPct" step="0.1" min="0" max="10" /> %
        &nbsp;and&nbsp;
        $ <input type="number" id="tolAbs" step="1" min="0" max="1000" /> abs
      </span>
    </label>
    <label>Date window ± days
      <input type="number" id="tolDays" step="1" min="0" max="120" />
    </label>
    <label>Min name score / 100
      <input type="number" id="tolName" step="1" min="0" max="100" />
    </label>
    <div class="presets">
      <span>quick:</span>
      <button data-days="5"  class="chip">±5d</button>
      <button data-days="10" class="chip">±10d</button>
      <button data-days="20" class="chip">±20d</button>
      <button data-days="30" class="chip">±30d</button>
    </div>
    <div class="popover-actions">
      <button id="tolReset" class="btn-ghost">Reset defaults</button>
      <button id="tolRun" class="btn-primary">Re-run reconciliation</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--border);margin:12px 0" />
    <label style="font-size:11px">Backend API base URL
      <input type="text" id="apiBase" style="width:100%;margin-top:3px"
             placeholder="https://…onrender.com" />
    </label>
    <div class="popover-actions">
      <button id="apiReset" class="btn-ghost">Use default</button>
      <button id="apiSave" class="btn-primary">Save &amp; reload</button>
    </div>
  </div>
  <div id="popoverScrim" class="scrim" hidden></div>

  <div id="banner" class="banner" role="alert" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
